<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; worker-src 'none'; frame-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161b">
  <meta name="description" content="Carbon Piano — learn to play piano with songs, note quizzes, and ear-training games.">
  <title>Carbon Piano</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="src/styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true">🎹</span> Carbon Piano</h1>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Modes"></nav>
    <details class="settings">
      <summary aria-label="Settings">⚙</summary>
      <div class="settings-body">
        <label class="toggle"><input id="opt-names" type="checkbox"> Note names on keys</label>
        <label class="toggle"><input id="opt-color" type="checkbox"> Rainbow key colors</label>
        <label class="toggle"><input id="opt-shortcuts" type="checkbox"> Computer key letters</label>
        <label class="slider">Volume <input id="opt-volume" type="range" min="0" max="100" step="1"></label>
        <div class="midi">
          <button id="midi-connect" class="btn" type="button">Connect a MIDI keyboard</button>
          <div id="midi-status" class="muted small"></div>
        </div>
      </div>
    </details>
  </header>

  <main id="stage" class="stage" role="tabpanel" aria-label="Activity"></main>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <div class="keyboard-wrap">
    <div id="keyboard"></div>
  </div>

  <noscript><p class="panel">Carbon Piano needs JavaScript to make sound. Please enable it.</p></noscript>
</body>
</html>
