name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the default token can only read the repo (NIST SP 800-53 AC-6).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax, security gate, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to full commit SHAs (supply-chain integrity, SR-3/SA-12).
      # Dependabot (.github/dependabot.yml) keeps these pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify there are no runtime dependencies to install
        run: |
          if [ -f package-lock.json ] || [ -d node_modules ]; then
            echo "::error::Dependencies detected. Review the dependency policy in SECURITY.md."
            exit 1
          fi
      - run: npm run check:syntax
      - run: npm run check:security
      - run: npm test
